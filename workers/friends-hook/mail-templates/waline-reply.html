<!--
  Waline 评论回复通知模板（MAIL_TEMPLATE）

  用法：整段贴进 Waline 项目的环境变量 MAIL_TEMPLATE，改完必须重新部署才生效。
  配套标题（MAIL_SUBJECT）：
    {{parent.nick}}，你在 {{site.name}} 的留言收到回复了

  可用变量：
    {{site.name}}     站点名
    {{site.url}}      站点地址
    {{site.postUrl}}  被回复的那篇文章地址
    {{parent.nick}}   被回复者昵称（收件人）
    {{parent.comment}}被回复的那条留言（已是 HTML）
    {{self.nick}}     回复者昵称
    {{self.comment}}  回复内容（已是 HTML）

  设计约束：邮件客户端只认 table + 内联样式，所以没用 flex/grid，
  也没有外链图片和外部 CSS —— 换到自己博客上不会出现裂图。
-->

<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
	{{self.nick}} 回复了你在 {{site.name}} 的留言
</div>

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;margin:0;padding:0;background:#eef5fb;">
	<tr>
		<td align="center" style="padding:32px 16px;">

			<table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:640px;margin:0 auto;border-collapse:separate;border-spacing:0;background:#ffffff;border:1px solid #e4eef7;border-radius:16px;overflow:hidden;">

				<!-- 顶部四色细条 -->
				<tr>
					<td style="padding:0;font-size:0;line-height:0;">
						<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:collapse;">
							<tr>
								<td width="25%" height="4" style="height:4px;background:#6eb7f5;font-size:0;line-height:0;">&nbsp;</td>
								<td width="25%" height="4" style="height:4px;background:#9cdaec;font-size:0;line-height:0;">&nbsp;</td>
								<td width="25%" height="4" style="height:4px;background:#f4d995;font-size:0;line-height:0;">&nbsp;</td>
								<td width="25%" height="4" style="height:4px;background:#9bbef6;font-size:0;line-height:0;">&nbsp;</td>
							</tr>
						</table>
					</td>
				</tr>

				<!-- 站点头 -->
				<tr>
					<td style="padding:18px 30px 15px;border-bottom:1px solid #eef4fa;">
						<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:collapse;">
							<tr>
								<td valign="middle" style="padding:0;color:#2a4d72;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;font-size:15px;font-weight:700;line-height:1.3;">
									{{site.name}}
									<span style="padding-left:7px;color:#8ba2bb;font-size:12px;font-weight:400;">{{site.url}}</span>
								</td>
								<td align="right" valign="middle" style="padding:0;color:#7892ad;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;font-size:12px;line-height:1.3;white-space:nowrap;">
									评论回复提醒
								</td>
							</tr>
						</table>
					</td>
				</tr>

				<!-- 主视觉 -->
				<tr>
					<td style="padding:24px 30px 0;">
						<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:separate;border-spacing:0;background:#eff8ff;border-radius:14px;">
							<tr>
								<td style="padding:26px 24px;">
									<p style="margin:0 0 9px;color:#315d8b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;font-size:22px;font-weight:700;line-height:1.4;">
										你的留言收到回复
									</p>
									<p style="margin:0;color:#62809d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;font-size:13px;line-height:1.8;">
										{{self.nick}} 接上了这段对话。点开看看，也许刚好能碰出新的想法。
									</p>
								</td>
							</tr>
						</table>
					</td>
				</tr>

				<!-- 你此前的留言 -->
				<tr>
					<td style="padding:22px 30px 0;">
						<p style="margin:0 0 8px;color:#6b88a6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;line-height:1.5;">
							你此前的留言
						</p>
						<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:separate;border-spacing:0;background:#f8fbfe;border-radius:11px;">
							<tr>
								<td style="padding:15px 17px;color:#667f97;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.85;word-break:break-word;">
									{{parent.comment | safe}}
								</td>
							</tr>
						</table>
					</td>
				</tr>

				<!-- 回复内容 -->
				<tr>
					<td style="padding:18px 30px 0;">
						<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:separate;border-spacing:0;background:#ffffff;border:1px solid #dbeaf8;border-radius:13px;">
							<tr>
								<td style="padding:19px 20px 18px;">
									<p style="margin:0 0 10px;color:#417eb5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;font-size:13px;font-weight:700;line-height:1.5;">
										{{self.nick}} 回复了你
									</p>
									<div style="margin:0;color:#344b62;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;font-size:15px;line-height:1.8;word-break:break-word;">
										{{self.comment | safe}}
									</div>
								</td>
							</tr>
						</table>
					</td>
				</tr>

				<!-- 按钮 -->
				<tr>
					<td align="center" style="padding:26px 30px 12px;">
						<table role="presentation" cellspacing="0" cellpadding="0" border="0">
							<tr>
								<td align="center" style="border-radius:9px;background:#6caeeb;">
									<a href="{{site.postUrl}}" target="_blank" style="display:inline-block;padding:12px 24px;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;font-size:14px;font-weight:700;line-height:1.2;text-decoration:none;">
										查看完整对话
									</a>
								</td>
							</tr>
						</table>
					</td>
				</tr>

				<!-- 页脚 -->
				<tr>
					<td style="padding:14px 30px 26px;">
						<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:collapse;">
							<tr>
								<td height="1" style="height:1px;background:#eef4fa;font-size:0;line-height:0;">&nbsp;</td>
							</tr>
							<tr>
								<td align="center" style="padding:16px 6px 0;color:#829ab1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;font-size:12px;line-height:1.8;">
									此邮件由 {{site.name}} 自动发送，请勿直接回复。<br>
									<a href="{{site.url}}" target="_blank" style="color:#6d8db0;text-decoration:none;">{{site.url}}</a>								</td>
							</tr>
						</table>
					</td>
				</tr>

			</table>

		</td>
	</tr>
</table>
