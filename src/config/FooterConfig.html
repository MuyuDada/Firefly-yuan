<style>
    /* ===== 页脚（签名区 + 文案区，桌面双列 / 移动端居中堆叠） ===== */
    .badge-footer {
        --ftr-text: var(--deep-text, rgba(0, 0, 0, 0.85));
        --ftr-line: rgba(0, 0, 0, 0.14);
        --ftr-hover-bg: rgba(0, 0, 0, 0.05);
        --ftr-btn-border: rgba(0, 0, 0, 0.32);

        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 46rem;
        margin: 0 auto;
        padding: 0 0 2px;
        color: var(--ftr-text);
        text-align: center;
        letter-spacing: 0.01em;
    }

    :root.dark .badge-footer {
        --ftr-text: oklch(0.86 0.012 var(--hue, 260));
        --ftr-line: rgba(255, 255, 255, 0.14);
        --ftr-hover-bg: rgba(255, 255, 255, 0.08);
        --ftr-btn-border: rgba(255, 255, 255, 0.32);
    }

    /* ① 主体：签名在上，文案在下，全部居中于同一条中轴 */
    .ftr-top {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    /* ② 签名动画（深/浅两张 SVG，按主题切换） */
    .ftr-sign {
        width: 100%;
        max-width: 17.5rem;
    }

    .ftr-sign img {
        display: block;
        width: 100%;
        height: auto;
    }

    /* 默认（浅色）只显示墨色版；深色版用同权重选择器显式隐藏，
       否则会被上面的 .ftr-sign img(0,1,1) 覆盖 */
    .ftr-sign .ftr-sign-img--dark {
        display: none;
    }

    :root.dark .ftr-sign .ftr-sign-img--light {
        display: none;
    }

    :root.dark .ftr-sign .ftr-sign-img--dark {
        display: block;
    }

    /* ③ 文案区：标语 / 导航 / 社交+计时，逐行收紧又能透气 */
    .ftr-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.55rem;
        width: 100%;
        margin-top: 1rem;
    }

    .ftr-tagline {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 400;
        letter-spacing: 0.07em;
        line-height: 1.7;
    }

    /* ④ 页脚导航（斜杠分隔，圆角悬停背景） */
    .ftr-nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.1rem 0.05rem;
        margin: 0;
        padding: 0;
        font-size: 0.8125rem;
        letter-spacing: 0.07em;
    }

    .ftr-nav a {
        color: var(--ftr-text);
        opacity: 0.78;
        padding: 0.15rem 0.38rem;
        border-radius: 0.35rem;
        text-decoration: none;
        transition: color 0.2s, background-color 0.2s, opacity 0.2s;
    }

    .ftr-nav a:hover {
        opacity: 1;
        background: var(--ftr-hover-bg);
    }

    .ftr-nav .ftr-sep {
        user-select: none;
        font-weight: 300;
        opacity: 0.3;
    }

    /* ⑤ 社交圆钮 + 运行计时 */
    .ftr-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.65rem 0.9rem;
        margin-top: 0.2rem;
    }

    .ftr-social {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.38rem;
    }

    .ftr-social-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.15rem;
        height: 2.15rem;
        border: 1px solid var(--ftr-btn-border);
        border-radius: 999px;
        color: var(--ftr-text);
        text-decoration: none;
        transition: color 0.2s, border-color 0.2s, background-color 0.2s, transform 0.2s;
    }

    .ftr-social-btn:hover {
        border-color: var(--ftr-text);
        background: var(--ftr-hover-bg);
        transform: translateY(-1px);
    }

    .ftr-social-btn svg {
        width: 1.05rem;
        height: 1.05rem;
        pointer-events: none;
    }

    .ftr-divider {
        width: 1px;
        height: 1.9rem;
        background: var(--ftr-line);
    }

    .ftr-status {
        font-size: 0.8125rem;
        line-height: 1.6;
        white-space: nowrap;
    }

    .ftr-num {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
    }

    .ftr-num--day {
        color: #FFA500;
    }

    .ftr-num--hour {
        color: #1DBF97;
    }

    .ftr-num--min {
        color: #8A2BE2;
    }

    .ftr-num--sec {
        color: #007EC6;
    }

    :root.dark .ftr-num {
        filter: brightness(1.3);
    }

    /* ⑥ 备案行 */
    .ftr-beian {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.25rem 0.35rem;
        font-size: 0.875rem;
        line-height: 1.6;
    }

    .ftr-beian a {
        display: inline-flex;
        align-items: center;
        gap: 0.28rem;
        color: var(--ftr-text);
        opacity: 0.86;
        text-decoration: none;
        transition: opacity 0.2s;
    }

    .ftr-beian a:hover {
        opacity: 1;
    }

    .ftr-beian svg {
        width: 0.875rem;
        height: 0.875rem;
        flex-shrink: 0;
    }

    .ftr-beian .ftr-dot {
        user-select: none;
        opacity: 0.6;
    }

    /* ⑦ 窄屏：只缩签名与字号，中轴不变 */
    @media (max-width: 560px) {
        .ftr-sign {
            max-width: 13.5rem;
        }

        .ftr-brand {
            margin-top: 0.85rem;
            gap: 0.5rem;
        }

        .ftr-meta {
            flex-direction: column;
            gap: 0.6rem;
        }

        .ftr-divider {
            display: none;
        }
    }

    @media (max-width: 400px) {
        .ftr-status {
            white-space: normal;
        }
    }
</style>

    <!-- ⑨ 运行计时脚本 -->
    <script is:inline>
        if (typeof window.__siteStartTime === "undefined") {
            window.__siteStartTime = "2026-08-24 00:00:00";
        }
        (function () {
            function startRuntime() {
                var el = document.getElementById("runtime");
                if (!el) return;
                function update() {
                    var diff = Date.now() - new Date(window.__siteStartTime).getTime();
                    if (diff < 0) diff = 0;
                    var d = Math.floor(diff / 86400000);
                    var h = Math.floor((diff % 86400000) / 3600000);
                    var m = Math.floor((diff % 3600000) / 60000);
                    var s = Math.floor((diff % 60000) / 1000);
                    el.innerHTML =
                        "⌛ 小破站已运行 <b class=\"ftr-num ftr-num--day\">" + d + "</b> 天" +
                        " <b class=\"ftr-num ftr-num--hour\">" + h + "</b> 时" +
                        " <b class=\"ftr-num ftr-num--min\">" + m + "</b> 分" +
                        " <b class=\"ftr-num ftr-num--sec\">" + s + "</b> 秒";
                }
                update();
                setInterval(update, 1000);
            }
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startRuntime);
            } else {
                startRuntime();
            }
        })();
    </script>
