<style>
    /* ===== 页脚（签名区 + 文案区，桌面双列 / 移动端居中堆叠） ===== */
    .badge-footer {
        --ftr-text: var(--deep-text, rgba(0, 0, 0, 0.85));
        --ftr-hover-bg: rgba(0, 0, 0, 0.05);
        --ftr-btn-border: rgba(0, 0, 0, 0.32);

        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 46rem;
        margin: 0 auto;
        padding: 0 0 2px;
        color: var(--ftr-text);
        text-align: center;
        letter-spacing: 0.01em;
    }

    :root.dark .badge-footer {
        --ftr-text: oklch(0.86 0.012 var(--hue, 260));
        --ftr-hover-bg: rgba(255, 255, 255, 0.08);
        --ftr-btn-border: rgba(255, 255, 255, 0.32);
    }

    /* ① 主体：签名在上，文案在下，全部居中于同一条中轴 */
    .ftr-top {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    /* ② 签名动画（深/浅两张 SVG，按主题切换） */
    .ftr-sign {
        width: 100%;
        max-width: 17.5rem;
    }

    .ftr-sign img {
        display: block;
        width: 100%;
        height: auto;
    }

    /* 默认（浅色）只显示墨色版；深色版用同权重选择器显式隐藏，
       否则会被上面的 .ftr-sign img(0,1,1) 覆盖 */
    .ftr-sign .ftr-sign-img--dark {
        display: none;
    }

    :root.dark .ftr-sign .ftr-sign-img--light {
        display: none;
    }

    :root.dark .ftr-sign .ftr-sign-img--dark {
        display: block;
    }

    /* ③ 文案区：标语 / 导航 / 社交+计时，逐行收紧又能透气 */
    .ftr-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.55rem;
        width: 100%;
        margin-top: 1rem;
    }

    .ftr-tagline {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 400;
        letter-spacing: 0.07em;
        line-height: 1.7;
    }

    /* ④ 页脚导航（斜杠分隔，圆角悬停背景） */
    .ftr-nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.1rem 0.05rem;
        margin: 0;
        padding: 0;
        font-size: 0.8125rem;
        letter-spacing: 0.07em;
    }

    .ftr-nav a {
        color: var(--ftr-text);
        opacity: 0.78;
        padding: 0.15rem 0.38rem;
        border-radius: 0.35rem;
        text-decoration: none;
        transition: color 0.2s, background-color 0.2s, opacity 0.2s;
    }

    .ftr-nav a:hover {
        opacity: 1;
        background: var(--ftr-hover-bg);
    }

    .ftr-nav .ftr-sep {
        user-select: none;
        font-weight: 300;
        opacity: 0.3;
    }

    /* ⑤ 社交圆钮 + 运行计时
       计时固定独占一行：留在同一行时，秒数位数变化会让这一行在宽度
       临界点上忽然折行，跳动很明显。竖排后位置恒定，也更符合单中轴 */
    .ftr-meta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.2rem;
    }

    .ftr-social {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.38rem;
    }

    .ftr-social-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.15rem;
        height: 2.15rem;
        border: 1px solid var(--ftr-btn-border);
        border-radius: 999px;
        color: var(--ftr-text);
        text-decoration: none;
        transition: color 0.2s, border-color 0.2s, background-color 0.2s, transform 0.2s;
    }

    .ftr-social-btn:hover {
        border-color: var(--ftr-text);
        background: var(--ftr-hover-bg);
        transform: translateY(-1px);
    }

    .ftr-social-btn svg {
        width: 1.05rem;
        height: 1.05rem;
        pointer-events: none;
    }

    .ftr-status {
        font-size: 0.8125rem;
        line-height: 1.6;
        /* 计时独占一行后仍不拆行，避免秒数变化时文字自己折成两截 */
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
    }

    .ftr-num {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
    }

    .ftr-num--day {
        color: #FFA500;
    }

    .ftr-num--hour {
        color: #1DBF97;
    }

    .ftr-num--min {
        color: #8A2BE2;
    }

    .ftr-num--sec {
        color: #007EC6;
    }

    :root.dark .ftr-num {
        filter: brightness(1.3);
    }

    /* ⑥ 备案行 */
    .ftr-beian {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.25rem 0.35rem;
        font-size: 0.875rem;
        line-height: 1.6;
    }

    .ftr-beian a {
        display: inline-flex;
        align-items: center;
        gap: 0.28rem;
        color: var(--ftr-text);
        opacity: 0.86;
        text-decoration: none;
        transition: opacity 0.2s;
    }

    .ftr-beian a:hover {
        opacity: 1;
    }

    .ftr-beian svg {
        width: 0.875rem;
        height: 0.875rem;
        flex-shrink: 0;
    }

    .ftr-beian .ftr-dot {
        user-select: none;
        opacity: 0.6;
    }

    /* ⑦ 窄屏：只缩签名与字号，中轴不变 */
    @media (max-width: 560px) {
        .ftr-sign {
            max-width: 13.5rem;
        }

        .ftr-brand {
            margin-top: 0.85rem;
            gap: 0.5rem;
        }
    }

    /* 极窄屏才允许计时文字内部折行（"XX 天 XX 时…" 太长时） */
    @media (max-width: 340px) {
        .ftr-status {
            white-space: normal;
        }
    }

    /* ⑩ 页脚粒子签名背景（效果参考 unitedcarriers.com 的 footer 粒子 Logo）
       PC 端（≥1100px 且未开启减少动效）用粒子拼出超大签名铺满页脚，
       鼠标靠近会把粒子推开、随后缓慢归位；签名图随深浅色主题切换重采样。
       移动端 / 减少动效 / 无 JS 时不激活，保留原静态签名 */
    .ftr-particle-canvas {
        display: none;
    }

    @media (min-width: 1100px) {
        .ftr-particles-active {
            position: relative;
        }

        .ftr-particles-active .ftr-particle-canvas {
            display: block;
            position: absolute;
            top: 0;
            /* left / width 由 JS 计算（视口全宽，避开滚动条） */
            height: 100%;
            pointer-events: none;
        }

        /* 文案层（含静态签名）抬到粒子层之上，签名保持原样不动 */
        .ftr-particles-active .ftr-top {
            position: relative;
        }
    }
</style>

    <!-- ⑨ 运行计时脚本 -->
    <script is:inline>
        if (typeof window.__siteStartTime === "undefined") {
            window.__siteStartTime = "2026-08-24 00:00:00";
        }
        (function () {
            function startRuntime() {
                var el = document.getElementById("runtime");
                if (!el) return;
                function update() {
                    var diff = Date.now() - new Date(window.__siteStartTime).getTime();
                    if (diff < 0) diff = 0;
                    var d = Math.floor(diff / 86400000);
                    var h = Math.floor((diff % 86400000) / 3600000);
                    var m = Math.floor((diff % 3600000) / 60000);
                    var s = Math.floor((diff % 60000) / 1000);
                    el.innerHTML =
                        "⌛ 小破站已运行 <b class=\"ftr-num ftr-num--day\">" + d + "</b> 天" +
                        " <b class=\"ftr-num ftr-num--hour\">" + h + "</b> 时" +
                        " <b class=\"ftr-num ftr-num--min\">" + m + "</b> 分" +
                        " <b class=\"ftr-num ftr-num--sec\">" + s + "</b> 秒";
                }
                update();
                setInterval(update, 1000);
            }
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startRuntime);
            } else {
                startRuntime();
            }
        })();
    </script>

    <!-- ⑩ 粒子签名背景：canvas 绘制大号 MUYUDADA 后采样成粒子（低透明度水印层），
         散开 → 聚拢成字，鼠标靠近推开、缓慢归位；主题切换 / 窗口尺寸变化时重采样。
         静态签名保持原样叠在上层。仅 PC（≥1100px）激活；
         减少动效与移动端自动回退为无背景 -->
    <script is:inline>
        (function () {
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            var canvas = document.getElementById("ftr-particle-canvas");
            if (!canvas) return;
            var footer = canvas.parentElement;

            var TEXT = "MUYUDADA";
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var ctx = canvas.getContext("2d");
            var particles = [];
            var rafId = 0, running = false;
            var mouse = { x: -9e9, y: -9e9, radius: 90 * dpr, active: false, timer: 0 };
            var baseRGB = "127,127,127";

            // 页脚文字色可能是 oklch() 等现代色彩，经 1×1 取样转成 sRGB 分量
            function refreshBaseColor() {
                var sw = document.createElement("canvas");
                sw.width = sw.height = 1;
                var sc = sw.getContext("2d");
                sc.fillStyle = getComputedStyle(footer).color;
                sc.fillRect(0, 0, 1, 1);
                var d = sc.getImageData(0, 0, 1, 1).data;
                baseRGB = d[0] + "," + d[1] + "," + d[2];
            }

            // 画布铺满视口宽（clientWidth 不含滚动条，避免横向溢出），
            // left 相对 .badge-footer 反推，高度撑满整个页脚块
            function sizeCanvas() {
                var w = document.documentElement.clientWidth;
                var left = -footer.getBoundingClientRect().left;
                canvas.style.width = w + "px";
                canvas.style.left = left + "px";
                canvas.width = Math.round(w * dpr);
                canvas.height = Math.round(footer.offsetHeight * dpr);
            }

            function setFont(px) {
                var family = getComputedStyle(footer).fontFamily || "sans-serif";
                ctx.font = "900 " + px + "px " + family;
                try {
                    ctx.letterSpacing = Math.round(px * 0.09) + "px";
                } catch (e) {
                    // 旧浏览器不支持 letterSpacing，忽略即可
                }
            }

            // 文本采样：fillText 后按网格取 alpha 位置生成粒子；
            // 粒子数超限就逐步放大间距重收，控制在交互流畅的量级
            function build() {
                var W = canvas.width, H = canvas.height;
                ctx.clearRect(0, 0, W, H);
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                // 字号：先按块高估初值，再按测宽校准到约 88% 视口宽
                var fontSize = Math.max(24, Math.round(H * 0.34));
                setFont(fontSize);
                var measured = ctx.measureText(TEXT).width || 1;
                var targetW = Math.min(W * 0.92, 2400 * dpr);
                fontSize = Math.max(24, Math.floor(fontSize * targetW / measured));
                // 高度约束：字高约 fontSize*0.72，不超过页脚块的 40%
                var maxFontH = H * 0.4 / 0.72;
                if (fontSize > maxFontH) fontSize = Math.floor(maxFontH);
                setFont(fontSize);

                ctx.fillStyle = "#000";
                ctx.fillText(TEXT, W / 2, H * 0.46);
                var data = ctx.getImageData(0, 0, W, H).data;
                ctx.clearRect(0, 0, W, H);

                var gap = Math.max(4, Math.round(Math.sqrt(3.2 * fontSize * fontSize / 3600)));
                collect(data, W, gap);
                while (particles.length > 4200 && gap < 40) {
                    gap += 2;
                    collect(data, W, gap);
                }
            }

            function collect(data, W, gap) {
                particles = [];
                for (var y = 0; y < canvas.height; y += gap) {
                    for (var x = 0; x < W; x += gap) {
                        var i4 = 4 * (Math.round(y) * W + Math.round(x));
                        if (data[i4 + 3] > 20) {
                            particles.push({
                                ox0: x, oy0: y,
                                x: Math.random() * W, y: Math.random() * canvas.height,
                                vx: 0, vy: 0,
                                ease: 0.045 + 0.045 * Math.random(),
                                easeFast: 0.22 + 0.18 * Math.random(),
                                friction: 0.82 + 0.14 * Math.random(),
                                size: (1.5 + Math.random() * 1.3) * dpr,
                                color: "rgba(" + baseRGB + ","
                                    + (0.16 + Math.random() * 0.16).toFixed(3) + ")",
                            });
                        }
                    }
                }
            }

            function frame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                var r2 = mouse.radius * mouse.radius;
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    if (mouse.active) {
                        var dx = mouse.x - p.x, dy = mouse.y - p.y;
                        var d2 = dx * dx + dy * dy;
                        if (d2 < r2) {
                            p.ease = p.easeFast;
                            var d = Math.sqrt(d2) || 1;
                            var f = -(mouse.radius - d) / mouse.radius * 9
                                * (0.6 + Math.random() * 0.8) * dpr;
                            p.vx += dx / d * f;
                            p.vy += dy / d * f;
                        } else {
                            p.ease += (0.06 - p.ease) * 0.03; // 缓慢回落到常态
                        }
                    }
                    p.vx *= p.friction;
                    p.vy *= p.friction;
                    p.x += p.vx + (p.ox0 - p.x) * p.ease;
                    p.y += p.vy + (p.oy0 - p.y) * p.ease;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size / 2, 0, 6.2832);
                    ctx.fill();
                }
                rafId = requestAnimationFrame(frame);
            }

            function start() {
                sizeCanvas();
                refreshBaseColor();
                build();
                footer.classList.add("ftr-particles-active");
                if (!running) {
                    running = true;
                    rafId = requestAnimationFrame(frame);
                }
            }

            // 鼠标位置换算到画布坐标（clientX/Y + 实时 rect，滚动也无碍）
            window.addEventListener("mousemove", function (e) {
                var r = canvas.getBoundingClientRect();
                mouse.x = (e.clientX - r.left) * dpr;
                mouse.y = (e.clientY - r.top) * dpr;
                mouse.active = true;
                clearTimeout(mouse.timer);
                mouse.timer = setTimeout(function () { mouse.active = false; }, 120);
            }, { passive: true });

            // 离开视口暂停，回来继续；页签隐藏时浏览器自动降频
            if (typeof IntersectionObserver !== "undefined") {
                new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting && !running && particles.length) {
                            running = true;
                            rafId = requestAnimationFrame(frame);
                        } else if (!entry.isIntersecting && running) {
                            running = false;
                            cancelAnimationFrame(rafId);
                        }
                    });
                }).observe(canvas);
            }

            // 主题切换（监听 dark 类变化）与窗口尺寸变化时重采样
            var themeTimer = 0;
            new MutationObserver(function () {
                clearTimeout(themeTimer);
                themeTimer = setTimeout(start, 150);
            }).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });

            var resizeTimer = 0;
            window.addEventListener("resize", function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function () {
                    if (window.innerWidth >= 1100) start();
                }, 250);
            });

            if (window.innerWidth >= 1100) {
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", start);
                } else {
                    start();
                }
            }
        })();
    </script>
</div>
